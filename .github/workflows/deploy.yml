name: Deploy to Droplet

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Frontend
        working-directory: ./marcos-frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.createdbypvo.online
        run: |
          npm ci
          npx next build

      - name: Build Backend
        working-directory: ./portfolio-backend
        run: |
          mvn clean package -DskipTests

      - name: Copy Frontend files to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "marcos-frontend/.next,marcos-frontend/public,marcos-frontend/package.json"
          target: "/root/Marcos-Art-portfolio/"
          strip_components: 1

      - name: Copy Backend JAR to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "portfolio-backend/target/portfolio-backend-0.0.1-SNAPSHOT.jar"
          target: "/root/Marcos-Art-portfolio/"
          strip_components: 1

      - name: Restart Services on Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/Marcos-Art-portfolio/marcos-frontend
            npm install --production --no-audit --no-fund
            pm2 restart marcos-frontend
            sudo systemctl restart portfolio-backend