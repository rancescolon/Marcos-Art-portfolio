name: Deploy Frontend to Droplet

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        working-directory: ./marcos-frontend
        run: |
          npm ci
          npx next build

      - name: Copy build output to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "marcos-frontend/.next,marcos-frontend/public,marcos-frontend/package.json"
          target: "/root/Marcos-Art-portfolio/"
          strip_components: 1

      - name: Restart PM2 Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/Marcos-Art-portfolio/marcos-frontend
            npm install --production --no-audit --no-fund
            pm2 restart marcos-frontend
